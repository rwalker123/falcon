[package]
name = "shadow_scale_godot"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
godot = { version = "0.5" }
shadow_scale_flatbuffers = { path = "../../../shadow_scale_flatbuffers" }
flatbuffers = "25.9.23"
rquickjs = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
sim_runtime = { path = "../../../sim_runtime" }
# Spoken narrator (Kokoro-82M through ONNX Runtime). espeak-ng is GPL-3 and is
# therefore only ever dlopen'd at runtime through libloading, never linked.
ort = "2.0.0-rc.15"
libloading = "0.8"
ndarray = "0.17"
ndarray-npy = { version = "0.10", default-features = false, features = ["npz"] }
