[package]
name = "sim_ai"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sim_ai"
path = "src/main.rs"

# ⛔ NEVER `core_sim`, NEVER `bevy` (`docs/plan_ai_opponents.md` §1). An AI is a player process: it
# reaches the world through a socket and nothing else, and that is enforced here rather than in
# review — `tests/crate_boundary.rs` fails the build the moment either name appears below.
[dependencies]
sim_runtime = { path = "../sim_runtime" }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip`: the ratchet holds a run to `baselines.json` at a tolerance of 0, so a measure
# written there must parse back to the very f64 it was written from. serde_json's default float
# parse is best-effort and can land one ulp off (seed 12's `food_stock` 20.447092056274414 read
# back as …418 and failed `--check` on an identical run).
serde_json = { version = "1.0", features = ["float_roundtrip"] }
rand = { version = "0.8", features = ["std_rng"] }
thiserror = "1.0"
schemars = { version = "0.8", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
# The shipped `data/ai_profiles.json` is validated against the schema `schemars` derives from
# `profile.rs`, so a key the struct does not know fails a unit test rather than loading as a default.
jsonschema = "0.17"
