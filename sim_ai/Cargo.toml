[package]
name = "sim_ai"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sim_ai"
path = "src/main.rs"

# ⛔ NEVER `core_sim`, NEVER `bevy` (`docs/plan_ai_opponents.md` §1). An AI is a player process: it
# reaches the world through a socket and nothing else, and that is enforced here rather than in
# review — `tests/crate_boundary.rs` fails the build the moment either name appears below.
[dependencies]
sim_runtime = { path = "../sim_runtime" }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = { version = "0.8", features = ["std_rng"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
