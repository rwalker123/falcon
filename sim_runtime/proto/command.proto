syntax = "proto3";

package shadow_scale.commands;

option optimize_for = SPEED;

// NOTE: *_UNSPECIFIED entries are reserved and will be rejected by the runtime
// decode helpers. Clients must populate concrete values before sending envelopes.
enum OrdersDirective {
  ORDERS_DIRECTIVE_UNSPECIFIED = 0;
  ORDERS_DIRECTIVE_READY = 1;
}

message TurnCommand {
  uint32 steps = 1;
}

message ResetMapCommand {
  uint32 width = 1;
  uint32 height = 2;
}

message OrdersCommand {
  uint32 faction_id = 1;
  OrdersDirective directive = 2;
}

message RollbackCommand {
  uint64 tick = 1;
}

message EspionageGeneratorUpdate {
  string template_id = 1;
  optional bool enabled = 2;
  optional uint32 per_faction = 3;
}

message UpdateEspionageGeneratorsCommand {
  repeated EspionageGeneratorUpdate updates = 1;
}

message QueueEspionageMissionCommand {
  string mission_id = 1;
  uint32 owner_faction = 2;
  uint32 target_owner_faction = 3;
  uint32 discovery_id = 4;
  uint32 agent_handle = 5;
  optional uint32 target_tier = 6;
  optional uint64 scheduled_tick = 7;
}

message UpdateEspionageQueueDefaultsCommand {
  optional uint32 scheduled_tick_offset = 1;
  optional uint32 target_tier = 2;
}

enum SecurityPolicyKind {
  SECURITY_POLICY_KIND_UNSPECIFIED = 0;
  SECURITY_POLICY_KIND_LENIENT = 1;
  SECURITY_POLICY_KIND_STANDARD = 2;
  SECURITY_POLICY_KIND_HARDENED = 3;
  SECURITY_POLICY_KIND_CRISIS = 4;
}

message UpdateCounterIntelPolicyCommand {
  uint32 faction = 1;
  SecurityPolicyKind policy = 2;
}

message AdjustCounterIntelBudgetCommand {
  uint32 faction = 1;
  optional float reserve = 2;
  optional float delta = 3;
}

enum ReloadConfigKind {
  RELOAD_CONFIG_KIND_UNSPECIFIED = 0;
  RELOAD_CONFIG_KIND_SIMULATION = 1;
  RELOAD_CONFIG_KIND_TURN_PIPELINE = 2;
  RELOAD_CONFIG_KIND_SNAPSHOT_OVERLAYS = 3;
  RELOAD_CONFIG_KIND_CRISIS_ARCHETYPES = 4;
  RELOAD_CONFIG_KIND_CRISIS_MODIFIERS = 5;
  RELOAD_CONFIG_KIND_CRISIS_TELEMETRY = 6;
}

message ReloadConfigCommand {
  ReloadConfigKind kind = 1;
  optional string path = 2;
}

message SetCrisisAutoSeedCommand {
  bool enabled = 1;
}

// Fog of war master switch. Server-owned on purpose: unseen herds are dropped from the payload
// before it leaves the sim, so a client-local render flag cannot reveal them.
message SetFogEnabledCommand {
  bool enabled = 1;
}

message SpawnCrisisCommand {
  uint32 faction = 1;
  string archetype_id = 2;
}

message SetStartProfileCommand {
  string profile_id = 1;
}

message ScoutAreaCommand {
  uint32 faction_id = 1;
  uint32 target_x = 2;
  uint32 target_y = 3;
  optional uint64 band_id = 4;
}

message FollowHerdCommand {
  uint32 faction_id = 1;
  string herd_id = 2;
  optional string policy = 3;
  optional uint64 band_id = 4;
}

message FoundSettlementCommand {
  uint32 faction_id = 1;
  uint32 target_x = 2;
  uint32 target_y = 3;
}

message ForageTileCommand {
  uint32 faction_id = 1;
  uint32 target_x = 2;
  uint32 target_y = 3;
  string module = 4;
  optional uint64 band_id = 5;
}

message HuntGameCommand {
  uint32 faction_id = 1;
  uint32 target_x = 2;
  uint32 target_y = 3;
  optional uint64 band_id = 4;
}

message HuntFaunaCommand {
  uint32 faction_id = 1;
  string herd_id = 2;
  optional uint64 band_id = 3;
}

// The intensification ladder's animal rung-2 verb: set the Tame policy on the bands already hunting
// this herd (needs Herding knowledge, earned by Sustain-hunting a Thriving herd, and a species whose
// husbandry_ceiling allows domestication). Taming pays a reduced take while the herd is gentled,
// then the herd becomes pastoral livestock. Replaces the retired DomesticateCommand early-claim,
// which let the player skip that investment.
message TameCommand {
  uint32 faction_id = 1;
  string herd_id = 2;
}

message CultivateCommand {
  uint32 faction_id = 1;
  uint32 target_x = 2;
  uint32 target_y = 3;
}

// The intensification ladder's plant rung-3 verb: set the Sow policy on the bands already foraging
// this tile (needs Seed Selection knowledge, earned by working tended patches). Sow PLACES a food
// source — it builds a Field even on a tile that carries no forage site at all, because seed travels.
// But rung 3 carries seed, NOT water or fertilizer, so the land must already do the fertilizing: only
// ground that is ALREADY VERY FERTILE (min_forage_capacity 195 — the delta/floodplain/alluvial class)
// AND NEAR FRESH WATER will take it (the plant:field rung's site_requirement). That is ~46 of 4160
// tiles on a standard map — merely bearing some food is nowhere near enough. Thin or dry ground waits
// for rung 4 (Worked Land). The refusal says which: too_poor / too_dry / too_poor_and_too_dry.
message SowCommand {
  uint32 faction_id = 1;
  uint32 target_x = 2;
  uint32 target_y = 3;
}

// The intensification ladder's animal rung-3 verb: pen the domesticated herd standing on the target
// tile into a fixed corral. Needs PENNING knowledge — earned by working an already-TAMED (pastoral)
// herd, not by hunting a wild one: you learn to pen by keeping. (Herding gates `tame`, and only
// `tame` — one knowledge per rung-transition.) A corralled herd stops roaming and pays its keeper
// place-local.
message CorralCommand {
  uint32 faction_id = 1;
  uint32 target_x = 2;
  uint32 target_y = 3;
}

// Grazing 2d-beta: grow the fenced footprint of a built pen by one ring (pen_radius += 1), worked off
// over turns by the keeper band's labor (the corral build ladder). A ring rides the SAME animal:pen
// rung as the initial build, so it takes that rung's gate too: needs PENNING knowledge (not Herding —
// see CorralCommand), an owned penned herd whose corral tile is (target_x, target_y), pen_radius below
// the configured max, and no extension already in flight.
message ExtendPenCommand {
  uint32 faction_id = 1;
  uint32 target_x = 2;
  uint32 target_y = 3;
}

// The Telling (fork tier): answer a pending narrative fork. `beat_id` names the fork the faction
// has on the table and `choice_id` one of that beat's authored choices; the choice's writes land in
// the BeatLedger (declared stance offsets, flags), the beat is marked fired, and its echo line joins
// the command feed. Every fork carries exactly one "defer" choice (validated at catalog load), which
// is the explicit out the client's turn gate depends on.
message AnswerForkCommand {
  uint32 faction_id = 1;
  string beat_id = 2;
  string choice_id = 3;
}

message CancelOrderCommand {
  uint32 faction_id = 1;
  optional uint64 band_id = 2;
  // What the cancel clears: "all" (worked sources + standing roles + stop movement),
  // "work" (Forage/Hunt only, movement untouched), "roles" (Scout/Warrior only, movement
  // untouched). Absent == "all", the historical behaviour.
  optional string scope = 3;
}

// Early-Game Labor (slice 3a): set the worker count for one labor target on a band
// (idempotent; 0 unassigns; clamped to the band's free working-age headroom).
message AssignLaborCommand {
  uint32 faction_id = 1;
  optional uint64 band_id = 2;
  string role = 3;              // "forage" | "hunt" | "scout" | "warrior"
  uint32 workers = 4;
  optional uint32 target_x = 5; // forage tile
  optional uint32 target_y = 6;
  optional string fauna_id = 7; // hunt target herd
  // RETIRED by the harvest floor arc (docs/plan_harvest_floor.md): a labor assignment carries a
  // `floor` now, not a stance. The field number is NOT reused and NOT renumbered — a shipped number
  // is immutable — and the server ignores any value sent in it.
  optional string policy = 8;
  // Which named plant a forage Cultivate/Sow should commit the patch to (a flora_config.json
  // species key). Absent = "pick the tile's dominant legal plant". Appended (append-only).
  optional string species = 9;
  // WHERE THE CREW STOPS, as a fraction of the source's carrying capacity — the whole of what the
  // player decides about harvest pressure. The take is
  //   min(workers x per-worker throughput, max(0, B - floor*K) x build dip)
  // Absent = the sim's default (0.5, the food peak, the sustainable one). Rejected with a command
  // failure unless finite and within 0.0..=1.0 — never clamped, because a clamp turns a typo into a
  // quiet policy change. Appended (append-only).
  optional float floor = 10;
  // THE KIT this crew works under (equipment.json `kits`). Absent = the job's default. An unknown
  // id, or one whose `jobs` does not cover this role, is a COMMAND FAILURE with a reason — never a
  // silent fall back to the default, because naming a kit is how the player compares tiers.
  // Ignored by the band-wide roles (scout/warrior), which consume no kit component.
  // Appended (append-only).
  optional string kit_id = 11;
}

// Travel a band toward a target tile at band_move_tiles_per_turn/turn.
message MoveBandCommand {
  uint32 faction_id = 1;
  optional uint64 band_id = 2;
  uint32 target_x = 3;
  uint32 target_y = 4;
}

// Outfit and launch a scouting expedition: draw party_workers + provisions off the home band and
// send a detached traveling party toward the target tile.
message SendExpeditionCommand {
  uint32 faction_id = 1;
  optional uint64 band_id = 2;
  uint32 party_workers = 3;
  uint32 target_x = 4;
  uint32 target_y = 5;
}

// Order an in-flight expedition home (phase -> Returning; folds back on arrival).
message RecallExpeditionCommand {
  uint32 faction_id = 1;
  uint64 expedition_band_id = 2;
}

// Form a new band — a resident band splits in two on the tile it is standing on. `workers` is the
// player's ONE input; children, elders and every store divide on the share it implies
// (docs/plan_band_fission.md §Q3).
message SplitBandCommand {
  uint32 faction_id = 1;
  optional uint64 band_id = 2;
  uint32 workers = 3;
}

// Outfit and launch a hunting expedition: draw party_workers off the home band and send a detached
// party to follow the herd fauna_id (lives off its kills — no provisions drawn).
message SendHuntExpeditionCommand {
  uint32 faction_id = 1;
  optional uint64 band_id = 2;
  uint32 party_workers = 3;
  string fauna_id = 4;
  // RETIRED by the harvest floor arc: a raid names a `floor`, not a stance. The field number is NOT
  // reused and NOT renumbered — a shipped number is immutable — and the server ignores any value.
  optional string policy = 5;
  // WHERE THE RAID STOPS, as a fraction of the herd's carrying capacity. Absent = the sim's default
  // (0.5, the food peak). Rejected with a command failure unless finite and within 0.0..=1.0 —
  // never clamped. Appended (append-only).
  optional float floor = 6;
  // RETIRED with the player-set fill target (docs/plan_hunt_through_combat.md §5.2, marked retired
  // in place). It named a count of whole animals to come home with, below the pack's capacity. Trip
  // length is `carry / (engage_rate × stay_chance × body_mass)` — PARTY SIZE CANCELS — so it was the
  // only lever on a species-and-kit constant, and the trips it existed to escape are a TUNING
  // problem (issue #491), not a control problem. The field number is NOT reused and NOT renumbered —
  // a shipped number is immutable — and the server ignores any value, exactly as `policy` above.
  optional uint32 fill_target = 7;
  // THE KIT the party is SENT OUT WITH — resolved ONCE at launch and carried for the party's whole
  // life, never re-resolved against the band's later stock. Absent = the hunt job's default. An
  // unknown id, or one whose `jobs` does not include `hunt`, is a command failure with a reason.
  // Appended (append-only).
  optional string kit_id = 8;
}

// Outfit and launch a DENIAL RAID: draw party_workers off the home band and send a detached party to
// erase the herd fauna_id (docs/plan_denial_raid.md).
//
// IT CARRIES NO FLOOR, and that absence is the design. Its escapement ceiling is the herd's whole
// standing stock, so there is no floor to name. You choose a herd and a party size — which is
// precisely why it is a separate command rather than a value on send_hunt_expedition.
//
// It aims at a HERD, never at a player: there is deliberately no target-faction field (§2).
message SendDenialRaidCommand {
  uint32 faction_id = 1;
  optional uint64 band_id = 2;
  uint32 party_workers = 3;
  string fauna_id = 4;
  // THE KIT the raid is sent out with — same rule as SendHuntExpeditionCommand.kit_id. This is the
  // one place the denial raid's grammar is NOT closed: a kit is a property of the party, not of the
  // mission, so it is the one thing there is to say about a raid that carries no floor and no fill
  // target. Appended (append-only).
  optional string kit_id = 5;
}

// ONE LINE OF A SHIPMENT — a quantity of one thing (arc #527, issue #517).
//
// `is_material` disambiguates two namespaces that share a string key space: `id` is either a FOOD
// commodity key (the band larder's `provisions`) or a `materials.json` material id. A flag rather
// than two repeated fields, so the order the player named the lines in survives, and so a third
// account (fodder) is a value rather than a schema change.
message TradeCargoItem {
  string id = 1;
  bool is_material = 2;
  float amount = 3;
}

// Outfit and launch a TRADE EXPEDITION: draw party_workers off the home band, load them with cargo
// out of that band's store, and send them to deliver it to another band
// (docs/plan_contact_and_logistics.md Q5). The party walks home empty — a shipment is one-way in
// this slice.
//
// IT IS GATED ON A CONNECTION, NOT ON A FACTION. The sending band must hold a live tie to the
// destination band (ConnectionLedger strength > 0); there is deliberately NO same-faction check
// anywhere, because faction is a property of the endpoint. A destination in another faction works by
// construction.
//
// IT FAILS CLOSED, like its sibling verbs: empty cargo, cargo the band does not hold, cargo over the
// party's carry cap, an unknown material id, a destination that is not a band, and a destination with
// no tie are each a command failure with a reason — never a clamp and never a silent drop.
message SendTradeExpeditionCommand {
  uint32 faction_id = 1;
  optional uint64 band_id = 2;
  uint32 party_workers = 3;
  // The destination's BandId — the durable id, never an entity.
  uint64 destination_band_id = 4;
  repeated TradeCargoItem cargo = 5;
  // THE KIT the party is sent out with — same rule as SendHuntExpeditionCommand.kit_id.
  optional string kit_id = 6;
}

// Ask the server to republish the world as a FULL snapshot.
//
// Client-initiated recovery for delta streaming: a client that cannot apply a delta (its
// `baseFrameSeq` names a frame the client never applied, or it belongs to a different world) drops
// the frame and asks for a baseline rather than merging into the wrong state. Carries no arguments
// — the server always answers with the world it currently holds, and the client's `worldEpoch`
// gate decides whether that is the world it wanted.
message ResyncCommand {}

// ABANDON a running improvement: clear the build verb off every band of this faction working the
// named source, leaving the harvest STANCE and the crew exactly as they are.
//
// The counterpart of `cultivate` / `sow` / `tame` / `corral` — the one command that passes `None`
// where those four pass a verb. It exists because the two-axis split (issue #442) otherwise removed a
// capability the old model had by accident: when the build verb WAS the policy, changing your mind
// meant picking another policy, and a 25-turn commitment could always be walked away from.
//
// UNGATED, deliberately. Abandonment is not a rung transition, so it asks for no knowledge, no
// species ceiling, no site and no ecology phase — a STALLED build on unhealthy ground is exactly when
// a player reaches for this, and gating it on the same conditions that started the build would make
// the remedy unreachable in precisely that case.
//
// It does NOT zero the meter. Each web already has a rule for a source nobody is improving, and this
// simply hands the source back to it: a plant meter bleeds at the rung's `decay_per_turn` (an
// abandoned part-prepared patch reverts toward 0 over ~100 turns), while `domestication_progress` is
// monotone-up and the pen rung's decay is 0, so an animal meter is kept. Identical to what already
// happens when an assignment lapses out of range.
//
// Names a SOURCE, not a verb — `kind` picks the web ("forage" uses target_x/target_y, "hunt" uses
// fauna_id), because at most one improvement is ever in flight on a source, so naming the source
// names the thing being abandoned.
message AbandonImprovementCommand {
  uint32 faction_id = 1;
  string kind = 2;      // "forage" | "hunt"
  uint32 target_x = 3;  // forage only
  uint32 target_y = 4;  // forage only
  string fauna_id = 5;  // hunt only
}

message ExportMapCommand {
  // Optional destination path. When absent the server writes a
  // timestamped file into the gitignored exports/ scratch directory.
  optional string path = 1;
}

// Boot-idle new game: the server boots with NO world generated, and this command generates one on
// demand. `preset_id` selects the map preset (an unknown id falls through to the worldgen default,
// mirroring ResetMap), `width`/`height` size the grid, `seed == 0` randomizes the map seed (mirrors
// ResetMap), and `profile_id` selects the start profile (an unknown id is rejected — the world is NOT
// built). Shares the world-build path with ResetMap.
message NewGameCommand {
  string preset_id = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint64 seed = 4;
  string profile_id = 5;
}

// Which boot config a staged tuning override applies to. Deliberately a SHORT list: these are the
// kinds the client's tuning manifest exposes, not every config the sim loads.
enum ConfigOverrideKind {
  CONFIG_OVERRIDE_KIND_UNSPECIFIED = 0;
  CONFIG_OVERRIDE_KIND_SIMULATION = 1;
  CONFIG_OVERRIDE_KIND_LABOR = 2;
  CONFIG_OVERRIDE_KIND_DEMOGRAPHICS = 3;
  CONFIG_OVERRIDE_KIND_EXPEDITION = 4;
  CONFIG_OVERRIDE_KIND_COMBAT = 5;
  // The crafting arc's two tables. Append-only: 6 and 7 are the next free numbers.
  CONFIG_OVERRIDE_KIND_MATERIALS = 6;
  CONFIG_OVERRIDE_KIND_RECIPES = 7;
}

// Stage a config-tuning override that takes effect at the NEXT new_game — `build_headless_app`
// re-runs every `load_*_from_env`, so no process restart is needed.
//
// `patch_json` is a SPARSE patch: a JSON object holding only the parameters the designer edited,
// nested by their JSON-pointer path. The server deep-merges it into that kind's current effective
// JSON, parses the result through the kind's own `from_json_str` (where `validate` runs), and only
// then writes the file and registers the path. A patch that fails validation changes NOTHING —
// rejecting here is what keeps the deliberately strict boot loader from panicking later, arbitrarily
// far from the edit that caused it.
message SetConfigOverrideCommand {
  ConfigOverrideKind kind = 1;
  string patch_json = 2;
}

// Drop every staged override, so the next new_game boots on the shipped configs again.
message ClearConfigOverridesCommand {}

// Put a recipe on a band's crafting bench and draw idle workers onto it. MAKE IS THE ASSIGNMENT:
// there is no Crafter role and no labor target — crafting always has a subject, so it is staffed
// like a worked source. ONE JOB AT A TIME, so this replaces whatever was on the bench.
//
// An unknown recipe id, or one whose `requires_knowledge` the faction has not learned, is a command
// FAILURE with a reason — never a silent no-op, for the same reason an unknown kit id is.
message SetBenchCommand {
  uint32 faction_id = 1;
  uint64 band_id = 2;
  string recipe_id = 3;
  // Workers to put on the bench, clamped to the band's hands off other work. Absent — which for a
  // proto3 scalar is indistinguishable from an explicit 0, and is the shape the client always sends
  // — means "do not change the crew": an idle bench stages the recipe with NOBODY on it, and a
  // bench already running a job keeps the crew standing there through the swap. The sim never picks
  // a crew; `BenchCrewCommand` is how one is set, zero included.
  uint32 workers = 4;
}

// Take the job off a band's bench and hand its crew back to the idle pool.
message ClearBenchCommand {
  uint32 faction_id = 1;
  uint64 band_id = 2;
}

// Change the crew on a band's running bench, leaving the job and its progress alone.
message BenchCrewCommand {
  uint32 faction_id = 1;
  uint64 band_id = 2;
  uint32 workers = 3;
}

// ---------------------------------------------------------------------------------------------
// THE QUERY CHANNEL — the one message on this socket the server ANSWERS.
//
// Every other envelope here is an order: it mutates the world, it is logged for replay, and the
// client learns what happened from the next snapshot. A query mutates nothing. It asks the sim to
// evaluate a forecast at an EXACT (band, kit, party, floor) and write the answer straight back on
// the same TCP stream as a `QueryReplyEnvelope`, correlated by `request_id`.
//
// It exists because the pre-sampled estimate tables cannot answer the question the launch sheet
// actually asks. Those tables are quoted at ONE kit (the hunt job's default) over a FRESH component
// set, on a sampled floor × party ladder — so a band whose spears have run dry, or a player who
// picked the trapping kit, is quoted a party that does not exist. Sampling both axes per herd is
// also ~95% of snapshot capture, paid every frame for rows nobody reads.
//
// A query is answered from the LIVE world: this band's own equipment wear, this kit, this party
// size, this floor.
message QueryCommand {
  // Correlates the reply. The client owns the numbering; the server only echoes it.
  uint64 request_id = 1;
  oneof query {
    HuntTripForecastQuery hunt_trip_forecast = 2;
    DenialRaidForecastQuery denial_raid_forecast = 3;
  }
}

// "What does a raid of `party_workers` from `band_id`, carrying `kit_id`, take off `herd_id` if it
// stops at `floor`?"
message HuntTripForecastQuery {
  uint32 faction_id = 1;
  // The ASKING band — a durable `BandId`, never an ECS entity handle (same rule as every
  // band-addressed command above). Its LIVE equipment wear is what prices the answer, which is the
  // whole reason this is a query and not a table lookup.
  uint64 band_id = 2;
  string herd_id = 3;
  // An `equipment.json` roster id, and REQUIRED. Unknown, or one whose `jobs` does not list `hunt`,
  // is a `QueryError` — never a silent fall back to the job default, because a quietly re-armed
  // party answers a different question than the one asked.
  string kit_id = 4;
  uint32 party_workers = 5;
  // The composed floor, as a fraction of the herd's K.
  float floor = 6;
  // The sheet's floor presets, answered in the SAME round trip so a picker can label all three
  // buttons without three sockets' worth of latency. Same party size as the composed row.
  repeated float preset_floors = 7;
  // **The largest party this band could actually field** - its idle workers, which the client
  // already knows and the stepper already caps at. It bounds the `useful_cap` plateau scan below.
  //
  // The scan walks 1..=max CONTIGUOUSLY. It used to walk `expedition_config.estimate_party_sizes`,
  // a sampled ladder that existed only to make a pre-computed table affordable - and a sampled scan
  // finds a sampled plateau, so the answer was "the rung after which the payload stopped rising",
  // not the party after which it stopped rising. A query answers one herd for one band, so it can
  // afford to be exact.
  //
  // 0 means "do not scan": the reply's `useful_cap` comes back 0 and the client names no cap.
  uint32 max_party_workers = 8;
}

// The denial twin. No floor and no fill target: the mission carries neither.
message DenialRaidForecastQuery {
  uint32 faction_id = 1;
  uint64 band_id = 2;
  string herd_id = 3;
  string kit_id = 4;
  uint32 party_workers = 5;
  // **The largest party this band could field** - its idle workers, where the sheet's stepper
  // stops.
  //
  // It bounds the `party_needed` search, which walks 1..=max and stops at the first party that
  // actually drives the herd past recovery. The retired `denialPartyNeeded` searched a SAMPLED
  // axis and could therefore only ever name a sampled party; it could also name one the band had
  // no hope of raising. Bounding here means `party_needed = 0` says "no party YOU can field does
  // this", which is a fact the player can act on.
  uint32 max_party_workers = 6;
}

// The reply frame, written back on the command socket. A TOP-LEVEL message rather than a member of
// `CommandEnvelope`: the two directions carry different vocabularies and nothing but a query is ever
// answered.
message QueryReplyEnvelope {
  // Echoes the `QueryCommand.request_id` it answers.
  uint64 request_id = 1;
  oneof reply {
    HuntTripForecastReply hunt_trip_forecast = 2;
    DenialRaidForecastReply denial_raid_forecast = 3;
    QueryError error = 4;
  }
}

// A query the server declined to answer. `reason` is a machine-readable snake_case token
// ("no_active_world", "unknown_herd", "unknown_band", "unknown_kit", "kit_wrong_job",
// "invalid_floor", "invalid_party") — the client owns the prose.
message QueryError {
  string reason = 1;
}

// One answered forecast. `floor` / `party_workers` are ECHOED back deliberately: it makes the row
// self-describing, so a client can assert the answer is for what it asked rather than trusting
// position in a list.
// ONE MATERIAL A PROJECTION LANDS, AND HOW MUCH OF IT (arc #527) - the proto twin of the snapshot's
// MaterialPayoff table, and the shape every material readout in this arc uses.
//
// It carries NO quality reading, deliberately: a rating is a characteristic vector on the batch the
// take really creates, and a launch-sheet row asks the flat question "how much of what". The
// readings are not lost - they ride the batches, which is where merging belongs.
//
// NEVER sum a repeated field of these into one figure: that is the retired trade-goods axis under a
// new name, and it collapses the distinction the materials model exists to keep.
message MaterialPayoff {
  string material_id = 1;
  float amount = 2;
}

message HuntTripRow {
  float floor = 1;
  uint32 party_workers = 2;
  // Turns of hunting until the party comes home. `0` = never completed inside the forecast horizon —
  // the same NEVER_FILLED sentinel the retired estimate tables published; `bound` says which kind of
  // never.
  uint32 turns_to_fill = 3;
  // A `HuntTripBound` key: which stop ended the trip.
  string bound = 4;
  bool delivers_food = 5;
  // RETIRED (arc #527) with the trade-goods yield axis. RESERVED, never freed: concurrent branches
  // append here, and a shipped field number is immutable.
  reserved 6;
  // WHOLE animals killed, so uint32 — the same type the retired estimate tables published and the
  // same type `DenialRow.animals_killed` carries. A float here would let a client render "2.0
  // animals" and would type one quantity two ways inside a single reply.
  uint32 animals_taken = 7;
  float delivered_food = 8;
  // RETIRED (arc #527) — see the note on 6. RESERVED, never freed. Its replacement is
  // `delivered_material` below, which answers per material rather than flattening every one of them
  // into a single number — which is the whole reason the scalar went.
  reserved 9;
  float wasted_food = 10;
  // WHAT THE TRIP LANDS, PER MATERIAL — and on an INEDIBLE quarry (a wolf) the entire payload, since
  // `delivered_food` is 0 there and nothing else on this row can state what comes home.
  //
  // Projected off the SAME carried biomass `delivered_food` is projected from, turn by turn through
  // one accumulator, so the two readouts of one trip cannot disagree about it — and through the same
  // expression the live arm's `credit_material_yield` is paid on, so the promise is checkable
  // against what the home band ends up holding.
  //
  // EMPTY MEANS "NO ROW", NEVER "ZERO": most quarries are made of nothing anyone builds with, and a
  // published 0 would read as a raid that pays badly rather than one that pays in meat alone.
  repeated MaterialPayoff delivered_material = 11;
}

message HuntTripForecastReply {
  // The answer at the exact floor the query named.
  HuntTripRow at_composed = 1;
  // One row per `preset_floors` entry, in the SAME order. Empty if none were asked for.
  repeated HuntTripRow per_preset = 2;
  // **The max-useful party plateau** — the LAST party at which the delivered payload was still
  // rising with party size, scanned contiguously over `1..=max_party_workers` at the composed floor.
  // It is the largest party still worth sending, so a stepper seeds ON it, not one worker above:
  // `useful_cap + 1` is by construction the first party that adds nothing.
  //
  // `0` = **no usefulness cap to name** — the scan found no plateau because the payload never rose
  // above zero, or was still rising at the band's last fieldable worker, or no scan was asked for
  // (`max_party_workers = 0`).
  //
  // Server-side because the client can no longer find it: reading a plateau needs a row per party
  // size, and the pre-computed table that used to carry that axis is what the query replaced. It is
  // the SCAN only — the engagement-crew floor the client maxes into it is derivable from fields the
  // herd row already carries, and stays there with the prose.
  uint32 useful_cap = 3;
}

// Mirrors the wire's `DenialEstimate` row, field for field.
message DenialRow {
  uint32 party_workers = 1;
  // `0` = never past recovery inside the horizon; `outcome` says which kind of never.
  uint32 turns_to_collapse = 2;
  // The optimistic end (the FEWEST turns) and the pessimistic end.
  uint32 turns_to_collapse_low = 3;
  uint32 turns_to_collapse_high = 4;
  // A `DenialOutcome` key: "past_recovery" / "herd_lost" / "repelled" / "horizon".
  string outcome = 5;
  uint32 animals_killed = 6;
  float delivered_food = 7;
  float wasted_food = 8;
  // WHAT THE RAID LANDS, PER MATERIAL - the same haul `delivered_food` converts, and on an inedible
  // quarry the whole of it. Projected off the same carried-biomass accumulator. EMPTY means "no
  // row", never "zero"; never summed.
  repeated MaterialPayoff delivered_material = 11;
  // RETIRED (arc #527) with the trade-goods yield axis. RESERVED, never freed: concurrent branches
  // append here, and a shipped field number is immutable. `delivered_trade`'s replacement is
  // `delivered_material` below; `wasted_trade` has none, and NOT for the reason it was retired for —
  // a per-material vector states a projection fine (this row proves it). The waste line is out of
  // scope by decision: it is already legible as a percentage. Do NOT add a flat "wasted materials"
  // scalar, which would be the retired axis under a new name.
  reserved 9, 10;
}

message DenialRaidForecastReply {
  DenialRow at_composed = 1;
  // THE PARTY THE LAUNCH SHEET OPENS ON - the smallest party that actually drives this herd past
  // recovery, found by walking 1..=max_party_workers and stopping at the first success. Seed the
  // stepper here: below the requirement a denial raid accomplishes nothing however long it runs.
  //
  // 0 means "NO PARTY YOU CAN FIELD drives this herd down", never "send nobody". That meaning
  // CHANGED with the query: the retired HerdTelemetryState.denialPartyNeeded searched a sampled axis
  // with no notion of who was asking, so it could name a party the band had no hope of raising and
  // present it as the answer. This searches to the band's own last worker, so 0 is actionable -
  // raise more people, or pick another quarry. Render at_composed.outcome beside it, never a blank,
  // and never seed a stepper at 0.
  uint32 party_needed = 2;
}

message CommandEnvelope {
  optional uint64 correlation_id = 15;

  // Retired field numbers. Never reuse one: a stale client's message would silently decode as the
  // wrong command.
  //   24 `found_camp`  — retired.
  //   30 `domesticate` — the intensification ladder's animal rung-2 EARLY-CLAIM, retired in favour
  //      of `tame` (field 40), which makes the player actually pay the taming investment.
  //
  // The debug-poke block — 2, 5, 6, 7, 8, 9, 10. These were the manual injection entry points for
  // tile heat, axis bias, the influencer roster (support / suppress / channel boost / spawn) and the
  // corruption ledger. Every one of those systems is still simulated and still published; only the
  // hand-poking went, with the Inspector's Commands tab that was their sole caller.
  //   2  `heat`
  //   5  `axis_bias`
  //   6  `support_influencer`
  //   7  `suppress_influencer`
  //   8  `support_channel`
  //   9  `spawn_influencer`
  //   10 `inject_corruption`
  reserved 2, 5, 6, 7, 8, 9, 10, 24, 30;
  reserved "found_camp", "domesticate";
  reserved "heat", "axis_bias", "support_influencer", "suppress_influencer";
  reserved "support_channel", "spawn_influencer", "inject_corruption";

  oneof command {
    TurnCommand turn = 1;
    ResetMapCommand reset_map = 11;
    OrdersCommand orders = 3;
    RollbackCommand rollback = 4;
    UpdateEspionageGeneratorsCommand update_espionage_generators = 12;
    QueueEspionageMissionCommand queue_espionage_mission = 13;
    UpdateEspionageQueueDefaultsCommand update_espionage_queue_defaults = 14;
    UpdateCounterIntelPolicyCommand update_counter_intel_policy = 17;
    AdjustCounterIntelBudgetCommand adjust_counter_intel_budget = 18;
    ReloadConfigCommand reload_config = 16;
    SetCrisisAutoSeedCommand set_crisis_auto_seed = 19;
    SpawnCrisisCommand spawn_crisis = 20;
    SetStartProfileCommand set_start_profile = 21;
    ScoutAreaCommand scout_area = 22;
    FollowHerdCommand follow_herd = 23;
    ForageTileCommand forage_tile = 25;
    HuntGameCommand hunt_game = 26;
    FoundSettlementCommand found_settlement = 27;
    ExportMapCommand export_map = 28;
    HuntFaunaCommand hunt_fauna = 29;
    CancelOrderCommand cancel_order = 31;
    AssignLaborCommand assign_labor = 32;
    MoveBandCommand move_band = 33;
    SendExpeditionCommand send_expedition = 34;
    RecallExpeditionCommand recall_expedition = 35;
    SendHuntExpeditionCommand send_hunt_expedition = 36;
    CultivateCommand cultivate = 37;
    CorralCommand corral = 38;
    ExtendPenCommand extend_pen = 39;
    TameCommand tame = 40;
    SowCommand sow = 41;
    // Field numbers are immutable once released — 40 and 41 are held by `tame` and
    // `sow`, so `answer_fork` takes 42. Never renumber a field that has shipped.
    AnswerForkCommand answer_fork = 42;
    // 42 is held by `answer_fork`, so `new_game` takes 43 (the next free field, append-only).
    NewGameCommand new_game = 43;
    // 43 is held by `new_game`, so `set_fog` takes 44 (24 and 30 are reserved, not free).
    SetFogEnabledCommand set_fog = 44;
    ResyncCommand resync = 45;
    // 45 is held by `resync`, so `abandon_improvement` takes 46 (append-only; never renumber).
    AbandonImprovementCommand abandon_improvement = 46;
    // 46 is held by `abandon_improvement`; the config-override pair takes 47 and 48.
    SetConfigOverrideCommand set_config_override = 47;
    ClearConfigOverridesCommand clear_config_overrides = 48;
    // 48 is held by `clear_config_overrides`, so the denial raid takes 49 (append-only).
    SendDenialRaidCommand send_denial_raid = 49;
    // 49 is held by `send_denial_raid`, so the query channel takes 50. The ONE payload here the
    // server answers rather than applies — see `QueryCommand`.
    QueryCommand query = 50;
    // 50 is held by `query`, so the fission verb takes 51 (append-only; never renumber). The slot
    // carried `settle_expedition` when a founding was an expedition that stopped being one; that
    // framing is retired (docs/plan_band_fission.md → "Why not an expedition that settles") and the
    // slot was reused rather than burned, there being no shipped client to keep compatible with.
    SplitBandCommand split_band = 51;
    // 51 is held by `split_band`, so the crafting bench's three take 52-54 (append-only).
    SetBenchCommand set_bench = 52;
    ClearBenchCommand clear_bench = 53;
    BenchCrewCommand bench_crew = 54;
    // 54 is held by `bench_crew`, so the trade expedition takes 55 (append-only; never renumber).
    SendTradeExpeditionCommand send_trade_expedition = 55;
  }
}
