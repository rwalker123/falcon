name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # ⛔ CI LINKS ~150 TEST BINARIES, AND `[profile.dev]` ASKS FOR FULL DEBUGINFO.
  # `debuginfo=2` is the dominant term in both the on-disk size of those binaries and
  # the memory `ld` needs to produce them, and the runner has neither to spare — the
  # symptom is `error: linking with 'cc' failed` partway through the Build step, with
  # every compile having succeeded. `line-tables-only` keeps backtraces pointing at
  # real file:line, which is all CI reads them for; a developer's local build is
  # untouched, because this is an override of the profile, not an edit to it.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # The hub CLAUDE.md files are generated: their "THIS IS A HUB FILE" banner and
  # their routing blurb come from scripts/hub_{banner,blurb}_*.md, so an edit made
  # in the hub alone is silently reverted by the next split_claude_md.sh run.
  hub-docs-sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Hub banner/blurb still match their source files
      run: scripts/split_claude_md.sh --check

  pr-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Free disk space
      # The android SDK and CodeQL are by far the largest removable trees on the runner
      # image (~9 GB and ~5 GB); the three that were here before free ~2 GB between them,
      # which is why headroom ran out as the workspace grew rather than at any one commit.
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/share/swift
        sudo rm -rf /usr/local/share/boost
        df -h
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev unzip
    - name: Install flatc
      run: |
        FLATBUFFERS_VERSION=25.9.23
        curl -sSL -o flatc.zip "https://github.com/google/flatbuffers/releases/download/v${FLATBUFFERS_VERSION}/Linux.flatc.binary.g++-13.zip"
        unzip -o flatc.zip flatc
        sudo mv flatc /usr/local/bin/flatc
        sudo chmod +x /usr/local/bin/flatc
        rm flatc.zip
    - name: Install stable toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
    - name: Generate FlatBuffers bindings
      run: cargo build --locked --package shadow_scale_flatbuffers
    - name: Format generated bindings
      run: rustfmt shadow_scale_flatbuffers/src/generated/snapshot_generated.rs
    - name: Ensure generated bindings exist
      run: |
        if [ ! -f shadow_scale_flatbuffers/src/generated/snapshot_generated.rs ]; then
          echo "Missing generated FlatBuffer bindings; run 'cargo build -p shadow_scale_flatbuffers' locally." >&2
          exit 1
        fi
    - name: cargo fmt --check
      run: cargo fmt --all -- --check
    - name: cargo clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    # Dead `[`Thing::method`]` doc links ship silently: rustdoc::broken_intra_doc_links is
    # warn-by-default and nothing else here builds docs. The scope lives in the xtask, not in
    # this line — see xtask/src/doc_guard.rs.
    - name: rustdoc link guard
      run: cargo run --package xtask -- doc-guard
    # Headroom is reported HERE, not only after the cleanup step: the cache restore and
    # the clippy run between them are what actually consume it, so a `df -h` at cleanup
    # time says nothing about what Build starts with. When Build dies at the linker this
    # is the line that says whether disk was the reason.
    - name: Disk headroom before Build
      run: df -h
    - name: Build
      run: cargo build --workspace --all-targets --locked --verbose --jobs 2
    - name: Run tests
      run: cargo test --workspace --locked --verbose

  push-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Free disk space
      # The android SDK and CodeQL are by far the largest removable trees on the runner
      # image (~9 GB and ~5 GB); the three that were here before free ~2 GB between them,
      # which is why headroom ran out as the workspace grew rather than at any one commit.
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/share/swift
        sudo rm -rf /usr/local/share/boost
        df -h
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev unzip
    - name: Install flatc
      run: |
        FLATBUFFERS_VERSION=25.9.23
        curl -sSL -o flatc.zip "https://github.com/google/flatbuffers/releases/download/v${FLATBUFFERS_VERSION}/Linux.flatc.binary.g++-13.zip"
        unzip -o flatc.zip flatc
        sudo mv flatc /usr/local/bin/flatc
        sudo chmod +x /usr/local/bin/flatc
        rm flatc.zip
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        components: rustfmt, clippy
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: stable
    - name: Generate FlatBuffers bindings
      run: cargo build --locked --package shadow_scale_flatbuffers
    - name: Format generated bindings
      run: rustfmt shadow_scale_flatbuffers/src/generated/snapshot_generated.rs
    - name: Ensure generated bindings exist
      run: |
        if [ ! -f shadow_scale_flatbuffers/src/generated/snapshot_generated.rs ]; then
          echo "Missing generated FlatBuffer bindings; run 'cargo build -p shadow_scale_flatbuffers' locally." >&2
          exit 1
        fi
    - name: cargo fmt --check
      run: cargo fmt --all -- --check
    - name: cargo clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    # Dead `[`Thing::method`]` doc links ship silently: rustdoc::broken_intra_doc_links is
    # warn-by-default and nothing else here builds docs. The scope lives in the xtask, not in
    # this line — see xtask/src/doc_guard.rs.
    - name: rustdoc link guard
      run: cargo run --package xtask -- doc-guard
    - name: Disk headroom before Build
      run: df -h
    - name: Build
      run: cargo build --workspace --all-targets --locked --verbose
    - name: Run tests
      run: cargo test --workspace --locked --verbose
