[package]
name = "core_sim"
version = "0.1.0"
edition = "2021"

[lib]
name = "core_sim"
path = "src/lib.rs"

[features]
default = ["headless"]
headless = []

[dependencies]
bevy = { version = "0.13", default-features = false, features = [
    # Without this, `bevy_ecs` compiles the single-threaded executor and the turn runs on one
    # core no matter what the schedule says. It is half of a pair: the other half is not
    # `.chain()`-ing systems that have no dependency on each other (see `build_headless_app`).
    "multi-threaded",
    "bevy_asset",
    "bevy_audio",
    "bevy_core_pipeline",
    "bevy_gilrs",
    "bevy_render",
    "bevy_sprite",
    "bevy_winit",
    "x11",
    "png",
    "hdr"
] }
# TODO: narrow feature set for pure headless build
rand = { version = "0.8", features = ["small_rng"] }
rand_chacha = "0.3"
# `rc` is what lets `Arc<str>` / `Arc<[Arc<str>]>` serialize, which `KitChoice` — and therefore the
# whole `SimState` save format — needs. It is currently ALSO switched on by `sim_schema`, so
# dropping it here would appear to change nothing; naming it is what stops a future edit to a
# sibling crate's features from silently making the checkpoint unencodable.
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
# The save format's codec. JSON cannot express this checkpoint: `serde_json` admits only keys that
# serialize to a string or an integer, and the sim-state maps are keyed by `UVec2`, by tuples and by
# composite structs (`ConnectionKey`, `BandKey`). CBOR takes all three.
ciborium = "0.2"
# `UVec2` and every other glam type in `SimState` serializes only with this feature. It arrives
# transitively today via `bevy_reflect`'s `bevy_math` feature — which is exactly why it is named
# here: the `# TODO: narrow feature set for pure headless build` above is a live intention to prune
# bevy's features, and pruning the wrong one would take serde off glam and break saves.
glam = { version = "0.25", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
bevy_reflect = "0.13"
bevy_ecs = "0.13"
bevy_utils = "0.13"
rayon = "1.8"
sim_runtime = { path = "../sim_runtime" }
sim_schema = { path = "../sim_schema" }
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
notify = "6"
bitflags = { version = "2.4", features = ["serde"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
insta = "1.36"
# Tests that assert on what the CLIENT receives decode the published bytes rather than the
# in-process struct — see `tests/delta_streaming.rs`.
shadow_scale_flatbuffers = { path = "../shadow_scale_flatbuffers" }

[[bench]]
name = "turn_bench"
path = "benchmarks/turn_bench.rs"
harness = false

[[bench]]
name = "power_bench"
path = "benchmarks/power_bench.rs"
harness = false
