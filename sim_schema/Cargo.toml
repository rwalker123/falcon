[package]
name = "sim_schema"
version = "0.1.0"
edition = "2021"

[lib]
name = "sim_schema"
path = "src/lib.rs"

[dependencies]
ahash = "0.8"
# `rc` is what lets a state struct hold an `Arc<[_]>` for a payload that belongs to the world rather
# than to the frame (`ForagePatchState::composition`). These types go through serde in several places
# — `export_map`/`MapExport`, `hash_snapshot`'s bincode, the replay-determinism oracle, the
# `decode_fixture` round trip — and **none of them depends on sharing**, which is what makes serde's
# caveat (a round trip hands back one allocation per holder) harmless: the worst it does is re-split
# a fixture's baskets. The encoded bytes are unchanged either way, because serde forwards `Arc<[T]>`
# to the slice impl, so it serializes byte-identically to the `Vec<T>` this replaced. The live client
# wire is FlatBuffers and does not involve serde at all.
serde = { version = "1.0", features = ["derive", "rc"] }
bincode = "1.3"
serde_json = "1.0"
rand = { version = "0.8", features = ["small_rng"] }
flatbuffers = "25"
shadow_scale_flatbuffers = { path = "../shadow_scale_flatbuffers" }
