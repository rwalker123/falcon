[package]
name = "sim_schema"
version = "0.1.0"
edition = "2021"

[lib]
name = "sim_schema"
path = "src/lib.rs"

[dependencies]
ahash = "0.8"
# `rc` is what lets a state struct hold an `Arc<[_]>` for a payload that belongs to the world rather
# than to the frame (`ForagePatchState::composition`). serde's caveat — a round trip does not
# preserve sharing — costs nothing here: the only serde consumer of these types is the `export_map`
# JSON dump, a debug artifact, and the live wire is FlatBuffers.
serde = { version = "1.0", features = ["derive", "rc"] }
bincode = "1.3"
serde_json = "1.0"
rand = { version = "0.8", features = ["small_rng"] }
flatbuffers = "25"
shadow_scale_flatbuffers = { path = "../shadow_scale_flatbuffers" }
